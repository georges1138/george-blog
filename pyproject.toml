[project]
name = "george-blog"
version = "0.1.0"
description = "A blog sample written in Python with Flask"
requires-python = ">=3.12"
dependencies = [
    "python-decouple>=3.8",
    "Flask>=3.1.3",
    "Flask-Bootstrap>=3.3.7.1",
    "Flask-CKEditor>=1.0.0",
    "Werkzeug>=3.1.8",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.1.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.3.0",
    "WTForms>=3.2.2",
    "psycopg2-binary>=2.9.13",
    "gunicorn>=26.2.0",
]
