[project]
name = "george-blog"
version = "0.1.0"
description = "A blog sample written in Python with Flask"
requires-python = ">=3.12"
dependencies = [
    "python-decouple>=3.8",
    "Flask>=3.1.3",
    "Flask-Bootstrap>=3.3.7.1",
    "Flask-CKEditor>=1.0.0",
    "Werkzeug>=3.1.8",
    "Flask-SQLAlchemy>=3.1.1",
    "SQLAlchemy>=2.1.0",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.3.0",
    "WTForms>=3.2.2",
    "gunicorn>=26.2.0",
    "nh3>=0.3.7",
    "flask-migrate>=4.1.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
